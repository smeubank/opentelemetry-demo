service:
  pipelines:
    # Extend the main traces pipeline: keep upstream exporters, add the routing connector.
    traces:
      exporters: [otlp_grpc/jaeger, debug, span_metrics, routing/sentry]

    # Per-service Sentry pipelines — each receives from the routing connector above.
    traces/sentry_default:
      receivers: [routing/sentry]
      exporters: [otlp_http/sentry]

    traces/sentry_ad:
      receivers: [routing/sentry]
      exporters: [otlp_http/sentry_ad]

    traces/sentry_cart:
      receivers: [routing/sentry]
      exporters: [otlp_http/sentry_cart]

    traces/sentry_accounting:
      receivers: [routing/sentry]
      exporters: [otlp_http/sentry_accounting]

    traces/sentry_checkout:
      receivers: [routing/sentry]
      exporters: [otlp_http/sentry_checkout]

    traces/sentry_productcatalog:
      receivers: [routing/sentry]
      exporters: [otlp_http/sentry_productcatalog]

    traces/sentry_email:
      receivers: [routing/sentry]
      exporters: [otlp_http/sentry_email]

    traces/sentry_frontend:
      receivers: [routing/sentry]
