# Opt-in collector layer that forwards OTLP traces to per-service Sentry projects.
# Traces are fanned out via the routing connector: each service.name maps to its own
# Sentry OTLP exporter, so issues land in the correct project with the right platform icon.
# Services not listed in the routing table fall back to the global SENTRY_OTLP_ENDPOINT.
#
# Enable by pointing the extras config layer at this file in .env.local:
#   OTEL_COLLECTOR_CONFIG_EXTRAS=./src/otel-collector/otelcol-config-sentry.yml
# and setting SENTRY_OTLP_ENDPOINT + SENTRY_OTLP_PUBLIC_KEY (global fallback).

connectors:
  # Fan traces out of the main pipeline into per-service Sentry sub-pipelines.
  routing/sentry:
    default_pipelines: [traces/sentry_default]
    error_mode: ignore
    table:
      - statement: route() where resource.attributes["service.name"] == "ad"
        pipelines: [traces/sentry_ad]
      - statement: route() where resource.attributes["service.name"] == "cart"
        pipelines: [traces/sentry_cart]
      - statement: route() where resource.attributes["service.name"] == "accounting"
        pipelines: [traces/sentry_accounting]
      - statement: route() where resource.attributes["service.name"] == "checkout"
        pipelines: [traces/sentry_checkout]
      - statement: route() where resource.attributes["service.name"] == "product-catalog"
        pipelines: [traces/sentry_productcatalog]
      - statement: route() where resource.attributes["service.name"] == "email"
        pipelines: [traces/sentry_email]
      - statement: route() where resource.attributes["service.name"] == "frontend" or resource.attributes["service.name"] == "frontend-web"
        pipelines: [traces/sentry_frontend]
      - statement: route() where resource.attributes["service.name"] == "payment"
        pipelines: [traces/sentry_payment]
      - statement: route() where resource.attributes["service.name"] == "quote"
        pipelines: [traces/sentry_quote]
      - statement: route() where resource.attributes["service.name"] == "recommendation"
        pipelines: [traces/sentry_recommendation]
      - statement: route() where resource.attributes["service.name"] == "shipping"
        pipelines: [traces/sentry_shipping]
      - statement: route() where resource.attributes["service.name"] == "fraud-detection"
        pipelines: [traces/sentry_fraud_detection]

exporters:
  # Global fallback — receives traces from services not in the routing table above.
  otlp_http/sentry:
    endpoint: ${env:SENTRY_OTLP_ENDPOINT}
    headers:
      x-sentry-auth: "sentry sentry_key=${env:SENTRY_OTLP_PUBLIC_KEY}"

  otlp_http/sentry_ad:
